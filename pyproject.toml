[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwcli"
version = "0.1.0"
description = "CLI for Remnawave (squads, users, create/delete, subscription servers) built on rw-sdk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rw-sdk>=3.3.2",
]
keywords = ["remnawave", "vpn", "cli", "xray"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rwcli = "rwcli:main"

[tool.setuptools]
py-modules = ["rwcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
